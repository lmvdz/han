name: ci

# Early development: every PR runs one lean job (a few minutes). The deep checks run nightly and on demand.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Spec fast checks (Policy vectors, consistency, docs match)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pip install cryptography
          python ref/run_vectors.py
          python ref/check_consistency.py
          python ref/sync_docs.py --check
