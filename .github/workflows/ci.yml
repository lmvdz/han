name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"   # nightly, 02:17 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every PR: the spec checks and the Python witness, on Linux.
  spec:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: witnesses/impl-py/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: witnesses/cleanroom-ts/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "witnesses/impl-py[dev]"
      - name: Build the TypeScript witness
        working-directory: witnesses/cleanroom-ts
        run: |
          npm ci
          npm run build
      - name: Spec checks (tsc, consistency, vectors, mutations, fuzz, wire, docs match)
        run: python ref/run_all.py --quick
        env:
          PYTHONIOENCODING: utf-8
      - name: Vectors regenerate without a diff
        run: |
          python ref/make_vectors.py
          python ref/make_wire_vectors.py
          git diff --exit-code -- conformance/vectors conformance/wire-vectors
      - name: Wire vectors against both witness servers
        run: |
          python ref/run_wire_vectors.py --launch py
          python ref/run_wire_vectors.py --launch ts
      - name: Python witness tests
        working-directory: witnesses/impl-py
        run: python -m pytest -q
      # The interop matrix (conformance/interop/run.py) launches the Python witness from its Windows venv path;
      # run it with `just interop` until lib.py resolves the interpreter portably.

  # Every PR: the TypeScript witness builds and replays the vectors on three operating systems.
  # Placeholder for the Rust build: enable the cargo steps below once crates/ exists.
  witness-matrix:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: witnesses/cleanroom-ts/package-lock.json
      - name: Build the TypeScript witness
        working-directory: witnesses/cleanroom-ts
        run: |
          npm ci
          npm run build
      - name: Policy vectors (TypeScript witness)
        working-directory: witnesses/cleanroom-ts
        run: npm run vectors
      # - uses: dtolnay/rust-toolchain@stable
      # - uses: Swatinem/rust-cache@v2
      # - name: Rust build and tests
      #   run: |
      #     cargo build --workspace --locked
      #     cargo nextest run --workspace --locked   # needs taiki-e/install-action with tool: cargo-nextest
      # - name: Rust conformance (policy vectors, wire vectors)
      #   run: cargo run --locked -p han -- conform

  # Nightly: the deep checks.
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: witnesses/cleanroom-ts/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography
      - name: Build the TypeScript witness
        working-directory: witnesses/cleanroom-ts
        run: |
          npm ci
          npm run build
      - name: Differential fuzz, 1000 seeds
        run: python ref/fuzz_diff.py --seeds 1000
        env:
          PYTHONIOENCODING: utf-8
      - name: Guard model mutations, depth 4
        run: python ref/model_guard.py --depth 4 --all-mutations
        env:
          PYTHONIOENCODING: utf-8
