name: full

# The deep checks: for release versions and on demand, not nightly (decided 2026-10-15: heavy builds only when they
# make sense; every land is gated by ci.yml's `quick`). Not required for merging. The advisory job alone stays daily,
# since a new advisory can appear without any change of ours and it compiles nothing.
on:
  push:
    tags: ["v0.*"]   # the same tags release.yml builds
  schedule:
    - cron: "43 5 * * *"   # 05:43 UTC: the advisory job only (see `advisories`)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    if: github.event.schedule != '43 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml; run_all's timeline row and the Rust fuzz target need it)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: witnesses/cleanroom-ts/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "witnesses/impl-py[dev,claude]"
      - name: Build the TypeScript witness
        working-directory: witnesses/cleanroom-ts
        run: |
          npm ci
          npm run build
      - name: Spec checks
        env:
          PYTHONIOENCODING: utf-8
        run: python ref/run_all.py --quick
      - name: Wire vectors against both witness servers
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python ref/run_wire_vectors.py --launch py
          python ref/run_wire_vectors.py --launch ts
      - name: Python witness tests
        working-directory: witnesses/impl-py
        run: python -m pytest -q
      - name: Differential fuzz, 1000 seeds, against the TypeScript witness and the Rust han-core
        env:
          PYTHONIOENCODING: utf-8
        run: python ref/fuzz_diff.py --target both --seeds 1000

  # cargo test on all three OSes. cargo-deny's advisories run in their own job, so a new advisory does not mask a
  # test result (and the reverse); the other deny checks (bans, licences, sources) stay here.
  rust-matrix:
    if: github.event.schedule != '43 5 * * *'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45   # windows: the workspace tests plus the cache save run close to 30 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny
      - run: cargo test --workspace --locked
      - run: cargo deny check bans licenses sources
      - name: Test mode is compiled out of the release binary (R9)
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p han --locked
          ! ./target/release/han seq --help | grep -e '--test-mode'
          ! ./target/release/han --help | grep -e '^  conform '

  # The Linux-only sandbox tests (bubblewrap; han-host's sandbox_probe). rust-matrix runs them too where the
  # runner allows user namespaces; this job installs bubblewrap and makes sure of that, so a skipped backend
  # shows up here as a failure of the assertion below instead of a silent pass.
  sandbox-linux:
    if: github.event.schedule != '43 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install bubblewrap and allow unprivileged user namespaces (Ubuntu 24.04 restricts them by default)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-user --unshare-net --ro-bind / / true
      - name: Sandbox tests
        run: cargo test -p han-host --locked --test sandbox_probe -- --nocapture

  # The dogfood loop end to end, on the real binaries (apps/han/tests/e2e): `han dev up` builds a home, a node, a
  # space, an agent (the fake ACP agent in the real sandbox with the production shim), an executor, a fake GitHub
  # and a local remote, and the tests drive it. Slow (a few minutes), so nightly only, not in `quick`. On Linux
  # a missing sandbox is a failure (HAN_E2E_REQUIRE_SANDBOX); Windows runners may not allow MXC, so the agent
  # falls back to advisory there.
  e2e:
    if: github.event.schedule != '43 5 * * *'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install bubblewrap and allow unprivileged user namespaces (Ubuntu 24.04 restricts them by default)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-user --unshare-net --ro-bind / / true
          echo "HAN_E2E_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
      - name: Build every binary the stack runs (han, han-github, han-fake-agent)
        run: cargo build --workspace --bins --locked
      - name: End-to-end tests
        run: cargo test -p han --features conformance --test e2e --locked -- --ignored --test-threads=1 --nocapture

  # R15 end to end with real OS users (apps/han/tests/e2e/os_user.rs): `han runner setup` makes han-agent1 and
  # han-exec in a systemd container, an OS-user agent (the han-agent@ unit) proposes a git_push, and `han exec`
  # as han-exec lands it without reading the agent's workspace. The build lives under /srv: the agent's unit
  # has ProtectHome and PrivateTmp, and the binaries' paths are compiled into the test. The binaries are built with
  # `conformance`, as in the e2e job: the stack reads its presence settings from node.db, and nobody is there to approve.
  e2e-os-users:
    if: github.event.schedule != '43 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: /srv/han-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: A target directory outside /home
        run: sudo mkdir -p /srv/han-target && sudo chown "$(id -u):$(id -g)" /srv/han-target
      - name: Build every binary the stack runs, and the e2e test
        run: |
          cargo build --workspace --bins --locked --features han/conformance
          cargo test -p han --features conformance --test e2e --locked --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "e2e") | .executable' > /srv/han-target/e2e-path
      - name: A systemd container with git
        run: |
          sudo install -d -o "$(id -u)" /srv/han-image && cat > /srv/han-image/Containerfile <<'EOF'
          FROM docker.io/library/debian:trixie-slim
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends systemd systemd-sysv dbus polkitd git ca-certificates procps passwd && rm -rf /var/lib/apt/lists/*
          CMD ["/sbin/init"]
          EOF
          sudo podman build -t han-os-users /srv/han-image
          sudo podman run -d --name han-os-users --systemd=always --privileged -v /srv/han-target:/srv/han-target:ro han-os-users
          sudo podman exec han-os-users bash -c 'for b in han han-fake-agent han-github; do install -m755 /srv/han-target/debug/$b /usr/local/bin/$b; done'
      - name: The OS-user test
        run: |
          sudo podman exec -w /srv han-os-users bash -c "mkdir -p /srv/tmp && TMPDIR=/srv/tmp HAN_E2E_OS_USERS=1 $(cat /srv/han-target/e2e-path) --ignored --exact os_user::an_os_user_agents_push_lands_through_an_executor_that_cannot_read_its_workspace --nocapture"
          sudo podman exec -w /srv han-os-users bash -c "mkdir -p /srv/tmp && TMPDIR=/srv/tmp HAN_E2E_OS_USERS=1 $(cat /srv/han-target/e2e-path) --ignored --exact os_user::an_os_user_agents_sandbox_is_checked_by_its_host_not_by_the_node --nocapture"
          # Last: the second test needs the container to have no bubblewrap, this one needs it.
          sudo podman exec han-os-users bash -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bubblewrap'
          sudo podman exec -w /srv han-os-users bash -c "mkdir -p /srv/tmp && TMPDIR=/srv/tmp HAN_E2E_OS_USERS=1 $(cat /srv/han-target/e2e-path) --ignored --exact os_user::the_host_admits_its_sandbox_under_the_agent_units_directives --nocapture"

  # Known-vulnerable and unmaintained dependencies. A new advisory can appear without any change of ours, which is
  # why this runs on a schedule. Failing here is a signal to look, not a merge blocker.
  advisories:
    if: github.event_name != 'schedule' || github.event.schedule == '43 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny (advisories; deny.toml carries the reviewed ignores)
        run: cargo deny check advisories
      - name: cargo audit (RustSec again, through a second reader of Cargo.lock)
        run: cargo audit --file Cargo.lock --ignore RUSTSEC-2024-0436
