[package]
name = "han-mcp"
description = "HAN agent tools over MCP (rmcp): propose, the only route out of the sandbox, and team.sessions, team.who_is_on, team.read and team.overlaps over the node API, every answer a data envelope."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
han-node = { path = "../han-node", version = "0.1.0", default-features = false }
rmcp = { version = "=3.5.1", default-features = false, features = ["server"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
rmcp = { version = "=3.5.1", features = ["client", "server"] }
tokio = { workspace = true, features = ["test-util"] }
