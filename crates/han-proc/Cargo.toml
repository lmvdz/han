[package]
name = "han-proc"
description = "HAN child-process helpers: spawn background children without a console window on Windows."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Also implement the helper for tokio::process::Command.
tokio = ["dep:tokio"]

[dependencies]
tokio = { workspace = true, features = ["process"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[lints.rust]
# Narrow Windows OS calls opt in locally; ordinary spawn code stays safe.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
