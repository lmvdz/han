[package]
name = "han-vcs"
description = "HAN version-control seam: create a session workspace at a base, diff it into a changeset, land by compare-and-swap, and simulate merges. Git first, over a shared read-only object store per device."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
