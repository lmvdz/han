[package]
name = "han-seq"
description = "HAN sequencer engine: the section 4.1 pipeline with a single writer, per-space SQLite storage, a steady clock, fan-out hooks and the carrier-independent call dispatcher. No network."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test mode (G-11): `Home::open_test`, the `test.clock` and `test.limits` calls, the peer filter admitting every node and `hello` binding no node. Never in a release build; the wire-vector and conformance runners and the tests enable it.
conformance = []

[dependencies]
han-core.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
rusqlite.workspace = true
# the tests run against test-mode homes
han-seq = { path = ".", features = ["conformance"] }

[lints]
workspace = true
