[package]
name = "han"
description = "The han command line: run the device node (han node), show the board (han board, or han tui for the live terminal face), run a home (han seq), dial one (han dial), and run the wire conformance vectors (han conform)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `han seq --test-mode` and `han conform`: a test-mode home for the wire conformance vectors. Off in release builds.
conformance = ["han-net/conformance"]

[dependencies]
clap.workspace = true
han-core.workspace = true
han-net.workspace = true
han-node.workspace = true
han-registry.workspace = true
han-seq.workspace = true
han-exec = { path = "../../crates/han-exec", version = "0.1.0" }
han-host = { path = "../../crates/han-host", version = "0.1.0" }
han-faces = { path = "../han-faces", version = "0.1.0" }
han-tui = { path = "../han-tui", version = "0.1.0" }
han-vcs = { path = "../../crates/han-vcs", version = "0.1.0" }
getrandom.workspace = true
interprocess = { version = "2.4", features = ["tokio"] }
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[lints]
workspace = true

# The MSI installer (cargo-dist, WiX). These GUIDs identify the product across upgrades: never change them.
[package.metadata.wix]
upgrade-guid = "A9A4FA1D-7033-4B78-8512-807A580572F5"
path-guid = "91504E97-FF8F-4764-BDC8-38D973C2E932"
license = false
eula = false
