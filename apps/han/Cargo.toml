[package]
name = "han"
description = "The han command line: run the device node (han node), show the board (han board, or han tui for the live terminal face), run a home (han seq), dial one (han dial), and run the wire conformance vectors (han conform)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
han-core.workspace = true
han-net.workspace = true
han-node.workspace = true
han-seq.workspace = true
han-exec = { path = "../../crates/han-exec", version = "0.1.0" }
han-host = { path = "../../crates/han-host", version = "0.1.0" }
han-tui = { path = "../han-tui", version = "0.1.0" }
han-vcs = { path = "../../crates/han-vcs", version = "0.1.0" }
getrandom.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
