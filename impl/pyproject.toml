[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "han"
version = "0.1.0"
description = "HAN v1 minimal reference implementation: sequencer (han-seq) and client over the generic binding"
requires-python = ">=3.11"
dependencies = ["websockets>=13", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
han-seq = "han.seq.__main__:main"

[tool.setuptools]
packages = ["han", "han.seq", "han.client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
