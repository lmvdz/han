# cargo-deny: licences compatible with Apache-2.0 OR MIT, no unknown sources, no known-vulnerable crates.

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # `paste` is unmaintained (a notice, not a vulnerability). It is a proc-macro reached only through iroh's
    # netwatch -> netdev -> netlink-packet-core; nothing of ours uses it, and there is no safe upgrade to pick.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro, transitive through iroh" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    # minicbor (the CBOR crate for bulk batches, PLAN 6.1): a permissive licence in the MIT/BSD family.
    "BlueOak-1.0.0",
    # webpki-roots and webpki-root-certs (the CA bundle, reached through iroh-relay and reqwest): a permissive
    # data licence.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The allow-list is a policy, not an inventory: do not warn about licences no dependency uses yet.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
