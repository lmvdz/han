[workspace]
resolver = "3"
members = [
    "crates/han-core",
    "crates/han-timeline",
    "crates/han-seq",
    "crates/han-net",
    "crates/han-presence",
    "crates/han-node",
    "crates/han-registry",
    "crates/han-vcs",
    "crates/han-mcp",
    "crates/han-exec",
    "crates/han-host",
    "apps/han",
    "apps/han-tui",
    "apps/han-faces",
    "integrations/han-github",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/lmvdz/han"

[workspace.dependencies]
base64 = "0.23"
ed25519-dalek = "3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
han-core = { path = "crates/han-core", version = "0.1.0" }
han-seq = { path = "crates/han-seq", version = "0.1.0" }
han-net = { path = "crates/han-net", version = "0.1.0" }
han-node = { path = "crates/han-node", version = "0.1.0" }
han-registry = { path = "crates/han-registry", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
getrandom = "0.3"
tracing = "0.1"
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Policy is the hot path of every append; keep tests that append thousands of entries quick.
[profile.dev.package.han-core]
opt-level = 2

[profile.dev.package.han-seq]
opt-level = 1

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
