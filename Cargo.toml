[workspace]
resolver = "3"
members = ["crates/han-core", "crates/han-timeline"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/lmvdz/han"

[workspace.dependencies]
base64 = "0.23"
ed25519-dalek = "3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
